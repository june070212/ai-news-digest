name: Build digest and deploy to GitHub Pages

# Fetches the RSS feeds, prerenders assets/data.json, and publishes the
# repository root using the official GitHub Pages Actions flow.
# Set Settings → Pages → Source to "GitHub Actions".

on:
  push:
    branches: [main]
  schedule:
    # Twice daily (06:00 and 18:00 UTC) so the digest stays fresh.
    - cron: "0 6,18 * * *"
  workflow_dispatch:

# Least-privilege permissions required to deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build digest
        run: node scripts/build-digest.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the whole repo root. All links are relative, so no base
          # path rewriting is needed.
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
